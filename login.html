<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - PVB Estudio Creativo Campaign Analytics</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #000000 0%, #1a1a1a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            color: #333;
        }

        .login-container {
            background: #FFFFFF;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 400px;
            padding: 2.5rem;
        }

        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 1rem;
        }

        .logo-text {
            font-size: 32px;
            font-weight: 900;
            color: #000;
        }

        .logo-dot {
            color: #c9a96e;
            font-size: 32px;
        }

        .logo-name {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 2px;
            color: #000;
        }

        .login-header h1 {
            font-size: 24px;
            color: #333;
            margin-bottom: 0.5rem;
        }

        .login-header p {
            color: #666;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: #333;
        }

        .form-input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #E0E0E0;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s ease;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        .form-input:hover {
            border-color: #D0D0D0;
        }

        .form-input:focus {
            outline: none;
            border-color: #c9a96e;
            box-shadow: 0 0 0 3px rgba(255, 0, 0, 0.1);
        }

        .form-input:invalid:not(:placeholder-shown) {
            border-color: #DC2626;
            background-color: rgba(220, 38, 38, 0.02);
        }

        .form-input:valid:not(:placeholder-shown) {
            border-color: #16A34A;
        }

        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .remember-me input {
            margin-right: 0.5rem;
        }

        .forgot-password {
            color: #c9a96e;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .forgot-password:hover {
            color: #CC0000;
        }

        .btn-login {
            width: 100%;
            padding: 1rem;
            background: #c9a96e;
            color: #FFFFFF;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.3s ease, transform 0.1s ease;
        }

        .btn-login:hover {
            background: #CC0000;
        }

        .btn-login:active {
            transform: scale(0.98);
        }

        .btn-login:disabled {
            background: #D4D4D4;
            cursor: not-allowed;
        }

        .alert {
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            display: none;
        }

        .alert-error {
            background: #FEE2E2;
            color: #991B1B;
            border: 1px solid #FCA5A5;
        }

        .alert-success {
            background: #D1FAE5;
            color: #065F46;
            border: 1px solid #6EE7B7;
        }

        .alert.show {
            display: block;
        }

        .network-status {
            background-color: #FEE2E2;
            color: #991B1B;
            padding: 10px;
            text-align: center;
            display: none;
            margin-bottom: 1rem;
            border-radius: 8px;
        }

        .debug-area {
            background-color: #f0f0f0;
            border: 1px solid #ccc;
            padding: 10px;
            margin-top: 1rem;
            font-family: monospace;
            white-space: pre-wrap;
            max-height: 200px;
            overflow-y: auto;
            font-size: 12px;
        }

        .debug-container {
            margin-top: 1rem;
            text-align: center;
        }

        .debug-toggle {
            background-color: #f0f0f0;
            border: 1px solid #ccc;
            padding: 5px 10px;
            cursor: pointer;
            margin-bottom: 10px;
        }

        /* Login Tabs */
        .login-tabs {
            display: flex;
            gap: 0;
            margin-bottom: 1.5rem;
            border-bottom: 2px solid #E0E0E0;
        }

        .tab-btn {
            flex: 1;
            padding: 0.75rem 1rem;
            background: transparent;
            border: none;
            border-bottom: 3px solid transparent;
            font-size: 14px;
            font-weight: 700;
            color: #666;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 4px 4px 0 0;
        }

        .tab-btn:hover {
            color: #333;
            background: rgba(0, 0, 0, 0.02);
        }

        .tab-btn:focus {
            outline: 2px solid #c9a96e;
            outline-offset: 2px;
        }

        .tab-btn.active {
            color: #c9a96e;
            border-bottom-color: #c9a96e;
        }

        /* Auth Forms */
        .auth-form {
            display: none;
        }

        .auth-form.active {
            display: block;
        }

        .terms-link {
            color: #c9a96e;
            text-decoration: none;
            font-weight: 600;
        }

        .terms-link:hover {
            text-decoration: underline;
        }

        /* Social Login Styles */
        .social-login-section {
            margin-top: 2rem;
        }

        .social-divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 1.5rem 0;
            color: #666;
            font-size: 14px;
        }

        .social-divider::before,
        .social-divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #E0E0E0;
        }

        .social-divider span {
            padding: 0 1rem;
        }

        .social-login-buttons {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.75rem;
        }

        .social-login-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            padding: 0.75rem 1rem;
            border: 1px solid #E0E0E0;
            border-radius: 8px;
            background: #FFFFFF;
            color: #333;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        .social-login-btn:hover {
            border-color: #CCC;
            background: #F9F9F9;
            transform: translateY(-1px);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .social-login-btn:active {
            transform: translateY(0);
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.1);
        }

        .social-login-btn svg {
            flex-shrink: 0;
        }

        .social-login-btn span {
            flex: 1;
            text-align: left;
        }

        .social-login-btn.google:hover {
            border-color: #4285F4;
            background: #F8F9FA;
        }

        .social-login-btn.facebook:hover {
            border-color: #1877F2;
            background: #F0F2F5;
        }

        .social-login-btn.github:hover {
            border-color: #181717;
            background: #F6F8FA;
        }

        .social-login-btn.apple:hover {
            border-color: #000;
            background: #F5F5F7;
        }

@media (max-width: 480px) {
            .social-login-buttons {
                grid-template-columns: 1fr;
            }
            .login-container {
                padding: 1.5rem;
                margin: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="network-status" id="networkStatus"></div>
        <div class="login-header">
            <div class="logo">
                <span class="logo-text">PVB</span>
                <span class="logo-dot">●</span>
                <span class="logo-name">ESTUDIO CREATIVO</span>
            </div>
            <div class="login-tabs">
                <button class="tab-btn active" data-tab="login">SIGN IN</button>
                <button class="tab-btn" data-tab="signup">SIGN UP</button>
            </div>
            <h1 id="pageTitle">Client Login</h1>
            <p id="pageSubtitle">Access your campaign analytics dashboard</p>
        </div>

        <div class="login-body">
            <div class="alert alert-error" id="errorAlert"></div>
            <div class="alert alert-success" id="successAlert"></div>

            <!-- Login Form -->
            <form id="loginForm" class="auth-form active">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        class="form-input"
                        placeholder="Enter your email"
                        required
                        autocomplete="email"
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        class="form-input"
                        placeholder="Enter your password"
                        required
                        autocomplete="current-password"
                    >
                </div>

                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" id="rememberMe" name="rememberMe">
                        Remember me
                    </label>
                    <a href="#" class="forgot-password">Forgot Password?</a>
                </div>

                <button type="submit" class="btn-login" id="loginBtn">
                    SIGN IN
                </button>
            </form>

            <!-- Signup Form -->
            <form id="signupForm" class="auth-form">
                <div class="form-group">
                    <label for="signupName">Full Name</label>
                    <input
                        type="text"
                        id="signupName"
                        name="full_name"
                        class="form-input"
                        placeholder="Enter your full name"
                        required
                        autocomplete="name"
                    >
                </div>

                <div class="form-group">
                    <label for="signupEmail">Email Address</label>
                    <input
                        type="email"
                        id="signupEmail"
                        name="email"
                        class="form-input"
                        placeholder="Enter your email"
                        required
                        autocomplete="email"
                    >
                </div>

                <div class="form-group">
                    <label for="signupPassword">Password</label>
                    <input
                        type="password"
                        id="signupPassword"
                        name="password"
                        class="form-input"
                        placeholder="Create a password (min. 8 characters)"
                        required
                        autocomplete="new-password"
                        minlength="8"
                    >
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        class="form-input"
                        placeholder="Confirm your password"
                        required
                        autocomplete="new-password"
                        minlength="8"
                    >
                </div>

                <div class="form-group">
                    <label class="remember-me">
                        <input type="checkbox" id="agreeTerms" name="agreeTerms" required>
                        I agree to the <a href="#" class="terms-link">Terms of Service</a> and <a href="#" class="terms-link">Privacy Policy</a>
                    </label>
                </div>

                <button type="submit" class="btn-login" id="signupBtn">
                    CREATE ACCOUNT
                    </button>
            </form>

            <!-- Social Login Section -->
            <div class="social-login-section">
                <div class="social-divider">
                    <span>Or continue with</span>
                </div>
                <div class="social-login-buttons">
                    <!-- Google (Gmail) - El más usado globalmente -->
                    <button class="social-login-btn google" data-provider="google" onclick="initiateSocialLogin('google')" aria-label="Sign in with Google">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                        </svg>
                        <span>Google</span>
                    </button>

                    <!-- Facebook - Muy popular en apps de consumidor -->
                    <button class="social-login-btn facebook" data-provider="facebook" onclick="initiateSocialLogin('facebook')" aria-label="Sign in with Facebook">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z" fill="#1877F2"/>
                        </svg>
                        <span>Facebook</span>
                    </button>

                    <!-- Apple - Requerido para apps iOS con login social -->
                    <button class="social-login-btn apple" data-provider="apple" onclick="initiateSocialLogin('apple')" aria-label="Sign in with Apple">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M12.152 6.896c-.948 0-2.415-1.078-3.96-1.04-2.04.027-3.91 1.183-4.961 3.014-2.117 3.675-.546 9.103 1.519 12.09 1.013 1.454 2.208 3.09 3.792 3.039 1.52-.065 2.09-.987 3.935-.987 1.831 0 2.35.987 3.96.948 1.637-.026 2.676-1.48 3.676-2.948 1.156-1.688 1.636-3.325 1.662-3.415-.039-.013-3.182-1.221-3.22-4.857-.026-3.04 2.48-4.494 2.597-4.559-1.429-2.09-3.623-2.324-4.39-2.376-2-.156-3.675 1.09-4.61 1.09zM15.53 3.83c.843-1.012 1.4-2.427 1.245-3.83-1.207.052-2.662.805-3.532 1.818-.78.896-1.454 2.338-1.273 3.714 1.338.104 2.715-.688 3.559-1.701" fill="#000000"/>
                        </svg>
                        <span>Apple</span>
                    </button>

                </div>
            </div>

        </div>
    </div>

    <!-- Supabase JS Client Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/dist/umd/supabase.min.js"></script>

    <script>
        const SUPABASE_URL = 'https://krmoihryyvooymvhsuno.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_siFuszUIw5ibS-2Y15O4-Q_k484kZ8i';

        // Initialize Supabase immediately — CDN script tag above is synchronous
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // --- Session helpers ---

        function storeSession(session) {
            localStorage.setItem('supabase_session', JSON.stringify(session));
            localStorage.setItem('session_id', session.access_token);
            localStorage.setItem('user_id', session.user.id);
            localStorage.setItem('email', session.user.email);
            localStorage.setItem('full_name', session.user.user_metadata?.full_name || session.user.email);
        }

        function showError(msg) {
            const el = document.getElementById('errorAlert');
            el.textContent = msg;
            el.classList.add('show');
        }

        function showSuccess(msg) {
            const el = document.getElementById('successAlert');
            el.textContent = msg;
            el.classList.add('show');
        }

        function clearAlerts() {
            document.getElementById('errorAlert').classList.remove('show');
            document.getElementById('successAlert').classList.remove('show');
        }

        // --- OAuth callback handler ---
        // Must be registered before any hash manipulation so Supabase can read the token.
        supabase.auth.onAuthStateChange((event, session) => {
            if (event === 'SIGNED_IN' && session) {
                storeSession(session);
                window.history.replaceState({}, document.title, window.location.pathname);
                window.location.replace('dashboard.html');
            }
        });

        // --- Tab switching ---

        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const tab = btn.dataset.tab;
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));
                document.getElementById(tab === 'login' ? 'loginForm' : 'signupForm').classList.add('active');
                document.getElementById('pageTitle').textContent = tab === 'login' ? 'Client Login' : 'Create Account';
                document.getElementById('pageSubtitle').textContent = tab === 'login'
                    ? 'Access your campaign analytics dashboard'
                    : 'Join PVB Estudio Creativo';
                clearAlerts();
            });
        });

        // --- Login form ---

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const btn = document.getElementById('loginBtn');

            clearAlerts();
            btn.disabled = true;
            btn.textContent = 'SIGNING IN...';

            try {
                const { data, error } = await supabase.auth.signInWithPassword({ email, password });
                if (error) {
                    showError(error.message);
                } else if (data.session) {
                    storeSession(data.session);
                    window.location.replace('dashboard.html');
                }
            } catch {
                showError('Unable to sign in. Please try again.');
            } finally {
                btn.disabled = false;
                btn.textContent = 'SIGN IN';
            }
        });

        // --- Signup form ---

        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const fullName = document.getElementById('signupName').value.trim();
            const email = document.getElementById('signupEmail').value.trim();
            const password = document.getElementById('signupPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const btn = document.getElementById('signupBtn');

            clearAlerts();

            if (password !== confirmPassword) return showError('Passwords do not match.');
            if (password.length < 8) return showError('Password must be at least 8 characters.');
            if (!document.getElementById('agreeTerms').checked) return showError('Please agree to the Terms of Service.');

            btn.disabled = true;
            btn.textContent = 'CREATING ACCOUNT...';

            try {
                const { data, error } = await supabase.auth.signUp({
                    email,
                    password,
                    options: { data: { full_name: fullName } }
                });

                if (error) {
                    showError(error.message);
                } else if (data.session) {
                    storeSession(data.session);
                    window.location.replace('dashboard.html');
                } else {
                    showSuccess(`Check your email (${email}) to confirm your account.`);
                }
            } catch {
                showError('Unable to create account. Please try again.');
            } finally {
                btn.disabled = false;
                btn.textContent = 'CREATE ACCOUNT';
            }
        });

        // --- Social login (OAuth) ---

        async function initiateSocialLogin(provider) {
            const supported = { google: 'google', facebook: 'facebook', apple: 'apple' };
            const supabaseProvider = supported[provider];
            if (!supabaseProvider) return showError(`Provider "${provider}" is not supported.`);

            try {
                const { error } = await supabase.auth.signInWithOAuth({
                    provider: supabaseProvider,
                    options: {
                        redirectTo: `${window.location.origin}/login.html`
                    }
                });
                if (error) showError(error.message);
            } catch {
                showError(`Unable to connect to ${provider}. Please try again.`);
            }
        }

        // --- Forgot password ---

        document.querySelector('.forgot-password').addEventListener('click', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            if (!email) return showError('Enter your email address above first.');

            const { error } = await supabase.auth.resetPasswordForEmail(email, {
                redirectTo: `${window.location.origin}/settings.html`
            });
            if (error) showError(error.message);
            else showSuccess(`Password reset link sent to ${email}.`);
        });

        // --- Network status ---

        function updateNetworkStatus() {
            const el = document.getElementById('networkStatus');
            if (!navigator.onLine) {
                el.textContent = 'You are offline. Please check your internet connection.';
                el.style.display = 'block';
            } else {
                el.style.display = 'none';
            }
        }
        window.addEventListener('online', updateNetworkStatus);
        window.addEventListener('offline', updateNetworkStatus);

        // --- Init ---

        document.addEventListener('DOMContentLoaded', async () => {
            updateNetworkStatus();

            // Show any OAuth error passed back in query params
            const params = new URLSearchParams(window.location.search);
            const oauthError = params.get('error');
            const oauthErrorDesc = params.get('error_description');
            if (oauthError) {
                showError(oauthErrorDesc ? decodeURIComponent(oauthErrorDesc) : decodeURIComponent(oauthError));
                window.history.replaceState({}, document.title, window.location.pathname);
            }

            // Redirect already-authenticated users straight to the dashboard
            const { data: { session } } = await supabase.auth.getSession();
            if (session) {
                storeSession(session);
                window.location.replace('dashboard.html');
            }
        });
    </script>
</body>
</html>
