<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil — Red de Proveedores PVB</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background: #0a0a0a; color: #fff; font-family: 'Inter', sans-serif; }

        .dash-header {
            background: #111;
            border-bottom: 1px solid #1f1f1f;
            padding: 20px var(--spacing-md, 24px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            flex-wrap: wrap;
        }
        .dash-logo img { height: 32px; }
        .dash-user {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 13px;
            color: #888;
        }
        .dash-user strong { color: #fff; }
        .dash-signout {
            background: none;
            border: 1px solid #333;
            color: #888;
            font-size: 11px;
            letter-spacing: 1px;
            padding: 6px 14px;
            cursor: pointer;
            font-family: inherit;
            transition: border-color .2s;
        }
        .dash-signout:hover { border-color: #666; color: #fff; }

        .dash-main {
            max-width: 900px;
            margin: 0 auto;
            padding: 48px 24px 80px;
        }

        .dash-section { margin-bottom: 48px; }
        .dash-section-title {
            font-size: 10px;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #555;
            margin-bottom: 20px;
        }

        /* Status badge */
        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            font-size: 10px;
            letter-spacing: 2px;
            text-transform: uppercase;
            border-radius: 2px;
        }
        .status-pending  { background: #1a1500; color: #f5c518; border: 1px solid #3a3000; }
        .status-active   { background: #0d1f0d; color: #4caf50; border: 1px solid #1a3a1a; }
        .status-contacted{ background: #0d0f1f; color: #6a8fff; border: 1px solid #1a2060; }
        .status-paused   { background: #1a1a1a; color: #666; border: 1px solid #333; }

        /* Profile card */
        .profile-card {
            background: #111;
            border: 1px solid #1f1f1f;
            padding: 28px;
            display: flex;
            gap: 24px;
            align-items: flex-start;
            flex-wrap: wrap;
        }
        .profile-avatar {
            width: 64px;
            height: 64px;
            background: #1f1f1f;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            flex-shrink: 0;
        }
        .profile-info { flex: 1; }
        .profile-info h2 { font-size: 1.4rem; margin-bottom: 6px; }
        .profile-info p { font-size: 13px; color: #888; line-height: 1.7; }

        /* Referral code */
        .referral-box {
            background: #0d1f0d;
            border: 1px solid #1a3a1a;
            padding: 20px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            flex-wrap: wrap;
        }
        .referral-box p { font-size: 13px; color: #888; margin-bottom: 6px; }
        .referral-code {
            font-size: 1.4rem;
            font-weight: 900;
            letter-spacing: 4px;
            color: #4caf50;
        }
        .copy-btn {
            background: none;
            border: 1px solid #2a4a2a;
            color: #4caf50;
            font-size: 11px;
            letter-spacing: 1px;
            padding: 8px 16px;
            cursor: pointer;
            font-family: inherit;
            transition: background .2s;
        }
        .copy-btn:hover { background: #1a3a1a; }

        /* Assets grid */
        .assets-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 16px;
        }
        .asset-card {
            background: #111;
            border: 1px solid #1f1f1f;
            padding: 20px;
        }
        .asset-card h4 { font-size: 14px; margin-bottom: 6px; }
        .asset-card p { font-size: 12px; color: #666; line-height: 1.6; }
        .asset-photo {
            width: 100%;
            height: 140px;
            object-fit: cover;
            margin-bottom: 14px;
            background: #1a1a1a;
        }
        .asset-status {
            font-size: 10px;
            letter-spacing: 2px;
            color: #4caf50;
            text-transform: uppercase;
            margin-top: 10px;
        }

        /* Matches */
        .match-list { display: flex; flex-direction: column; gap: 12px; }
        .match-card {
            background: #111;
            border: 1px solid #1f1f1f;
            border-left: 3px solid #6a8fff;
            padding: 18px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            flex-wrap: wrap;
        }
        .match-card h4 { font-size: 14px; margin-bottom: 4px; }
        .match-card p { font-size: 12px; color: #666; }
        .match-actions { display: flex; gap: 8px; }
        .btn-interested {
            background: #fff;
            color: #000;
            border: none;
            font-size: 11px;
            letter-spacing: 1px;
            padding: 8px 16px;
            cursor: pointer;
            font-family: inherit;
        }
        .btn-pass {
            background: none;
            border: 1px solid #333;
            color: #666;
            font-size: 11px;
            letter-spacing: 1px;
            padding: 8px 16px;
            cursor: pointer;
            font-family: inherit;
        }

        /* Stats */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 12px;
        }
        .stat-card {
            background: #111;
            border: 1px solid #1f1f1f;
            padding: 20px;
            text-align: center;
        }
        .stat-number { font-size: 2rem; font-weight: 900; color: #fff; }
        .stat-label { font-size: 10px; letter-spacing: 2px; color: #555; text-transform: uppercase; margin-top: 4px; }

        /* Empty state */
        .empty-state {
            padding: 40px 20px;
            text-align: center;
            color: #444;
            border: 1px dashed #222;
            font-size: 13px;
        }

        .loading { text-align: center; padding: 80px 20px; color: #444; font-size: 13px; letter-spacing: 2px; }
        /* Modal asset */
        .asset-modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,.9);
            display: flex; align-items: center; justify-content: center;
            z-index: 200; opacity: 0; pointer-events: none; transition: opacity .2s;
        }
        .asset-modal-overlay.open { opacity: 1; pointer-events: all; }
        .asset-modal {
            width: min(520px,95vw); background: #111; border: 1px solid #2a2a2a;
            padding: 28px; max-height: 90vh; overflow-y: auto;
            transform: translateY(20px); transition: transform .2s;
        }
        .asset-modal-overlay.open .asset-modal { transform: translateY(0); }
        .asset-modal h3 { font-size: 16px; font-weight: 700; margin-bottom: 20px; display: flex; justify-content: space-between; }
        .asset-modal-close { background: none; border: none; color: #666; cursor: pointer; font-size: 20px; }
        .am-group { margin-bottom: 14px; }
        .am-group label { display: block; font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: #666; margin-bottom: 7px; }
        .am-input { width: 100%; padding: 9px 13px; background: #1a1a1a; border: 1px solid #2a2a2a; color: #fff; font-size: 13px; font-family: inherit; outline: none; }
        .am-input:focus { border-color: #444; }
        .am-upload { border: 2px dashed #2a2a2a; padding: 20px; text-align: center; cursor: pointer; transition: border-color .15s; }
        .am-upload:hover { border-color: #444; }
        .am-upload input { display: none; }
        .am-upload p { font-size: 12px; color: #666; margin-top: 6px; }
        .am-photos-preview { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
        .am-photos-preview img { width: 70px; height: 70px; object-fit: cover; border: 1px solid #2a2a2a; }
        .am-error { color: #e55; font-size: 12px; margin-top: 8px; display: none; }
        .am-actions { display: flex; gap: 10px; margin-top: 18px; }
        .am-btn-primary { padding: 9px 18px; background: #fff; color: #000; border: none; font-size: 12px; letter-spacing: 1px; text-transform: uppercase; cursor: pointer; font-family: inherit; }
        .am-btn-ghost { padding: 9px 18px; background: none; border: 1px solid #2a2a2a; color: #666; font-size: 12px; letter-spacing: 1px; text-transform: uppercase; cursor: pointer; font-family: inherit; }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="dash-header">
        <div class="dash-logo">
            <a href="index.html"><img src="LOGO_PVB.png" alt="PVB Estudio Creativo"></a>
        </div>
        <div class="dash-user">
            <span>Hola, <strong id="headerName">—</strong></span>
            <button class="dash-signout" onclick="signOut()">Cerrar sesión</button>
        </div>
    </header>

    <main class="dash-main" id="dashMain">
        <div class="loading" id="loadingState">CARGANDO TU PERFIL...</div>
    </main>

    <script>
        const SUPABASE_URL = 'https://krmoihryyvooymvhsuno.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtybW9paHJ5eXZvb3ltdmhzdW5vIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njg4NzM5NjYsImV4cCI6MjA4NDQ0OTk2Nn0.VBiCJK4Goz6iao4fqUfOs3wrgMaFO-LUGZqOxp9UKKg';
        const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const STATUS_LABELS = {
            pending: 'En revisión',
            active: 'Activo',
            contacted: 'Contactado',
            paused: 'Pausado'
        };

        async function signOut() {
            await sb.auth.signOut();
            window.location.href = 'proveedores.html';
        }

        async function loadDashboard(user) {
            document.getElementById('headerName').textContent =
                user.user_metadata?.full_name?.split(' ')[0] || user.email;

            // Cargar perfil
            const { data: provider } = await sb
                .from('providers')
                .select('*, provider_assets(*)')
                .eq('user_id', user.id)
                .single();

            if (!provider) {
                // Usuario autenticado pero sin perfil → redirigir a registro
                window.location.href = 'proveedores.html';
                return;
            }

            // Cargar matches
            const { data: matches } = await sb
                .from('project_matches')
                .select('*, projects(*)')
                .eq('provider_id', provider.id)
                .order('notified_at', { ascending: false })
                .limit(10);

            renderDashboard(provider, matches || []);
        }

        function renderDashboard(p, matches) {
            const assets = p.provider_assets || [];
            const activeMatches = matches.filter(m => m.status === 'notified');

            document.getElementById('dashMain').innerHTML = `

                <!-- Stats -->
                <div class="dash-section">
                    <p class="dash-section-title">Resumen</p>
                    <div class="stats-row">
                        <div class="stat-card">
                            <div class="stat-number">${assets.length}</div>
                            <div class="stat-label">Assets registrados</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-number">${matches.length}</div>
                            <div class="stat-label">Proyectos considerado</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-number">${matches.filter(m => m.status === 'confirmed').length}</div>
                            <div class="stat-label">Trabajos confirmados</div>
                        </div>
                    </div>
                </div>

                <!-- Perfil -->
                <div class="dash-section">
                    <p class="dash-section-title">Tu perfil</p>
                    <div class="profile-card">
                        <div class="profile-avatar">👤</div>
                        <div class="profile-info">
                            <h2>${p.full_name}</h2>
                            <p>${p.email || ''} ${p.phone ? '· ' + p.phone : ''} ${p.instagram ? '· ' + p.instagram : ''}</p>
                            <p style="margin-top:8px;">Categoría: <strong>${p.category}</strong></p>
                        </div>
                        <span class="status-badge status-${p.status}">${STATUS_LABELS[p.status]}</span>
                    </div>
                </div>

                <!-- Matches / proyectos -->
                <div class="dash-section">
                    <p class="dash-section-title">Proyectos en los que puedes participar ${activeMatches.length > 0 ? '(' + activeMatches.length + ')' : ''}</p>
                    ${activeMatches.length === 0
                        ? '<div class="empty-state">Aún no hay proyectos disponibles para tu perfil. Te notificamos cuando aparezca uno.</div>'
                        : `<div class="match-list">${activeMatches.map(m => `
                            <div class="match-card">
                                <div>
                                    <h4>${m.projects?.title || 'Proyecto PVB'}</h4>
                                    <p>${m.projects?.description || ''} ${m.projects?.shoot_date ? '· ' + m.projects.shoot_date : ''}</p>
                                </div>
                                <div class="match-actions">
                                    <button class="btn-interested" onclick="respondMatch('${m.id}','interested')">Me interesa</button>
                                    <button class="btn-pass" onclick="respondMatch('${m.id}','rejected')">Paso</button>
                                </div>
                            </div>`).join('')}
                        </div>`
                    }
                </div>

                <!-- Assets -->
                <div class="dash-section">
                    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;">
                        <p class="dash-section-title" style="margin-bottom:0;">Tus assets (${assets.length})</p>
                        <button onclick="openAssetModal()" style="padding:8px 16px;background:#fff;color:#000;border:none;font-size:11px;letter-spacing:1px;text-transform:uppercase;cursor:pointer;font-family:inherit;">+ Agregar asset</button>
                    </div>
                    ${assets.length === 0
                        ? '<div class="empty-state">No tienes assets registrados. Agrega el primero.</div>'
                        : `<div class="assets-grid">${assets.map(a => `
                            <div class="asset-card">
                                ${a.photos?.[0] ? `<img src="${a.photos[0]}" class="asset-photo" alt="${a.title}">` : '<div class="asset-photo" style="background:#1a1a1a;display:flex;align-items:center;justify-content:center;font-size:32px;">📦</div>'}
                                <h4>${a.title}</h4>
                                <p>${a.description || ''}</p>
                                ${a.location ? `<p>📍 ${a.location}</p>` : ''}
                                <p class="asset-status">● ${a.status === 'available' ? 'Disponible' : a.status}</p>
                                <div style="display:flex;gap:8px;margin-top:10px;">
                                    <button onclick="openAssetModal('${a.id}')" style="flex:1;padding:6px;background:none;border:1px solid #333;color:#aaa;font-size:11px;cursor:pointer;font-family:inherit;">✎ Editar</button>
                                    <button onclick="deleteAsset('${a.id}')" style="padding:6px 10px;background:none;border:1px solid #3a1010;color:#e55;font-size:11px;cursor:pointer;font-family:inherit;">✕</button>
                                </div>
                            </div>`).join('')}
                        </div>`
                    }
                </div>

                <!-- Código de referido -->
                <div class="dash-section">
                    <p class="dash-section-title">Tu código de referido</p>
                    <div class="referral-box">
                        <div>
                            <p>Comparte este código con personas que puedan sumarse a la red. Si se concreta un trabajo, <strong>ganas un 5%</strong>.</p>
                            <div class="referral-code">${p.referral_code || '—'}</div>
                        </div>
                        <button class="copy-btn" onclick="copyCode('${p.referral_code}')">Copiar código</button>
                    </div>
                </div>
            `;
        }

        async function respondMatch(matchId, status) {
            await sb.from('project_matches').update({
                status,
                responded_at: new Date().toISOString()
            }).eq('id', matchId);
            location.reload();
        }

        function copyCode(code) {
            navigator.clipboard.writeText(code).then(() => {
                alert('Código copiado: ' + code);
            });
        }

        // Auth guard
        sb.auth.getSession().then(({ data: { session } }) => {
            if (!session) {
                window.location.href = 'proveedores.html';
            } else {
                loadDashboard(session.user);
            }
        });
    </script>
<!-- Modal Agregar/Editar Asset -->
<div class="asset-modal-overlay" id="assetModal">
    <div class="asset-modal">
        <h3>
            <span id="assetModalTitle">Agregar asset</span>
            <button type="button" class="asset-modal-close" onclick="closeAssetModal()">×</button>
        </h3>
        <div class="am-group">
            <label>Título</label>
            <input type="text" class="am-input" id="amTitle" placeholder="Ej: Departamento moderno Providencia">
        </div>
        <div class="am-group">
            <label>Descripción</label>
            <textarea class="am-input" id="amDesc" rows="3" placeholder="Describe tu asset con todos los detalles relevantes para una producción..."></textarea>
        </div>
        <div class="am-group">
            <label>Zona / Disponibilidad</label>
            <input type="text" class="am-input" id="amLocation" placeholder="Ej: Las Condes — disponible fines de semana">
        </div>
        <div class="am-group">
            <label>Fotos <span style="color:#555;font-size:9px;">(hasta 5, JPG/PNG)</span></label>
            <div class="am-upload" onclick="document.getElementById('amFiles').click()">
                <div style="font-size:28px;">📷</div>
                <p>Haz clic para subir fotos</p>
                <input type="file" id="amFiles" accept="image/*" multiple onchange="previewPhotos(this)">
            </div>
            <div class="am-photos-preview" id="amPreview"></div>
        </div>
        <p class="am-error" id="amError"></p>
        <div class="am-actions">
            <button type="button" class="am-btn-primary" id="amSaveBtn" onclick="saveAsset()">Guardar</button>
            <button type="button" class="am-btn-ghost" onclick="closeAssetModal()">Cancelar</button>
        </div>
    </div>
</div>

<script>
    let _editingAssetId = null;
    let _providerIdCache = null;
    let _newPhotos = [];

    function openAssetModal(assetId = null) {
        _editingAssetId = assetId;
        _newPhotos = [];
        document.getElementById('amTitle').value = '';
        document.getElementById('amDesc').value = '';
        document.getElementById('amLocation').value = '';
        document.getElementById('amPreview').innerHTML = '';
        document.getElementById('amError').style.display = 'none';
        document.getElementById('amFiles').value = '';
        document.getElementById('assetModalTitle').textContent = assetId ? 'Editar asset' : 'Agregar asset';

        if (assetId) {
            // Pre-cargar datos del asset desde el DOM
            const session = sb.auth.getSession();
            sb.from('provider_assets').select('*').eq('id', assetId).single().then(({ data }) => {
                if (data) {
                    document.getElementById('amTitle').value = data.title || '';
                    document.getElementById('amDesc').value = data.description || '';
                    document.getElementById('amLocation').value = data.location || '';
                    if (data.photos?.length) {
                        const preview = document.getElementById('amPreview');
                        data.photos.forEach(url => {
                            const img = document.createElement('img');
                            img.src = url;
                            preview.appendChild(img);
                        });
                    }
                }
            });
        }
        document.getElementById('assetModal').classList.add('open');
    }

    function closeAssetModal() {
        document.getElementById('assetModal').classList.remove('open');
        _editingAssetId = null;
    }

    document.getElementById('assetModal').addEventListener('click', e => {
        if (e.target === document.getElementById('assetModal')) closeAssetModal();
    });

    function previewPhotos(input) {
        _newPhotos = Array.from(input.files).slice(0, 5);
        const preview = document.getElementById('amPreview');
        // Mantener fotos existentes si estamos editando
        const existing = preview.querySelectorAll('img[data-existing]');
        preview.innerHTML = '';
        existing.forEach(img => preview.appendChild(img));
        _newPhotos.forEach(file => {
            const img = document.createElement('img');
            img.src = URL.createObjectURL(file);
            preview.appendChild(img);
        });
    }

    async function saveAsset() {
        const title = document.getElementById('amTitle').value.trim();
        const errEl = document.getElementById('amError');
        const btn = document.getElementById('amSaveBtn');
        errEl.style.display = 'none';
        if (!title) { errEl.textContent = 'El título es requerido.'; errEl.style.display = 'block'; return; }

        btn.disabled = true;
        btn.textContent = 'Guardando...';

        try {
            const { data: { session } } = await sb.auth.getSession();
            if (!session) throw new Error('No autenticado');

            // Obtener provider_id
            if (!_providerIdCache) {
                const { data: prov } = await sb.from('providers').select('id').eq('user_id', session.user.id).single();
                _providerIdCache = prov?.id;
            }

            const payload = {
                title,
                description: document.getElementById('amDesc').value.trim() || null,
                location: document.getElementById('amLocation').value.trim() || null,
            };

            let assetId = _editingAssetId;

            if (_editingAssetId) {
                await sb.from('provider_assets').update(payload).eq('id', _editingAssetId);
            } else {
                payload.provider_id = _providerIdCache;
                payload.status = 'available';
                const { data } = await sb.from('provider_assets').insert(payload).select().single();
                assetId = data?.id;
            }

            // Subir nuevas fotos
            if (_newPhotos.length > 0 && assetId) {
                const photoUrls = [];
                for (let i = 0; i < _newPhotos.length; i++) {
                    const file = _newPhotos[i];
                    const ext = file.name.split('.').pop();
                    const path = `${_providerIdCache}/${assetId}/${Date.now()}_${i}.${ext}`;
                    const { error } = await sb.storage.from('provider-assets').upload(path, file, { upsert: true });
                    if (!error) {
                        const { data: urlData } = sb.storage.from('provider-assets').getPublicUrl(path);
                        photoUrls.push(urlData.publicUrl);
                    }
                }
                if (photoUrls.length > 0) {
                    // Combinar con fotos existentes si es edición
                    if (_editingAssetId) {
                        const { data: existing } = await sb.from('provider_assets').select('photos').eq('id', assetId).single();
                        const allPhotos = [...(existing?.photos || []), ...photoUrls].slice(0, 5);
                        await sb.from('provider_assets').update({ photos: allPhotos }).eq('id', assetId);
                    } else {
                        await sb.from('provider_assets').update({ photos: photoUrls }).eq('id', assetId);
                    }
                }
            }

            closeAssetModal();
            location.reload();
        } catch (err) {
            errEl.textContent = err.message || 'Error al guardar.';
            errEl.style.display = 'block';
        } finally {
            btn.disabled = false;
            btn.textContent = 'Guardar';
        }
    }

    async function deleteAsset(assetId) {
        if (!confirm('¿Eliminar este asset?')) return;
        await sb.from('provider_assets').delete().eq('id', assetId);
        location.reload();
    }
</script>
</body>
</html>
